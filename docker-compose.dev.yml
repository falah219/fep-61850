# Lingkungan development lokal FEP IEC 61850: hanya toolchain (Rust + libIEC61850).
# Kafka, Postgres, dan simulator IED TIDAK disertakan di sini.
# Simulator opsional ada di docker-compose.sim.yml (2 IED) dan docker-compose.sim20.yml (20 IED).

services:
  dev:
    build: { context: ., dockerfile: docker/Dockerfile.dev, target: dev }
    command: sleep infinity
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/work/target
    environment:
      CARGO_TARGET_DIR: /work/target

volumes:
  cargo-registry:
  cargo-git:
  target:
