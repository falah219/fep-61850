apiVersion: v1
kind: ConfigMap
metadata:
  name: fep-iec61850-env
  namespace: fep-iec61850
data:
  # ISI sesuai lingkungan tujuan (lihat kubernetes/232/configmap.yaml di FEP IEC 104).
  POSTGRE_HOST: "<isi-host-postgres>"
  POSTGRE_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_DATABASE: "<isi-nama-db>"

  BOOTSTRAP_SERVER: "<isi-host1:port,host2:port>"
  SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  SASL_MECANISM: "PLAIN"
  SASL_USERNAME: "<isi-user-kafka>"
  # HARUS beda dengan FEP IEC 104 (IEC104_FEP_GROUP) supaya kedua FEP menerima semua pesan
  GROUP_ID: "IEC61850_FEP_GROUP"
  CLIENT_ID: "iec61850_fep_client"
  SUBSCRIBE_TOPICS: "RTU_EVENTS,RTU_COMMAND_CONFIG_REQUEST,MASTER_DATAPOINT_EVENT,MASTER_DATA_OBJECT_EVENT,CAPTURE_DATA_CHANGE,MASTER_RTU_EVENTS,MANUAL_SET_EVENT"
  AUTO_OFFSET_RESET: "latest"

  # Kirim ulang semua nilai polling tiap periode ini (ms)
  INTEGRITY_PERIOD_MS: "60000"
  # Coba ulang RCB yang gagal di-setup (detik)
  RCB_RETRY_SECS: "30"
  # Gabungkan reload per id_rtu dari MASTER_DATAPOINT_EVENT / CDC (ms)
  RELOAD_DEBOUNCE_MS: "2000"
  # ResvTms BRCB (detik): RCB tetap dipesan untuk FEP selama koneksi putus
  BRCB_RESV_TMS_SECS: "20"
  # Default tunggu CommandTermination (ms) kalau kolom oper_timeout_ms NULL
  OPER_TIMEOUT_MS: "10000"
  # Tunggu thread IED berhenti saat shutdown (detik); harus < terminationGracePeriodSeconds
  SHUTDOWN_WAIT_SECS: "5"
  # none | local | remote. BELUM dikonfirmasi tim (docs/CATATAN_TERBUKA.md)
  OSI_PARAMS_SIDE: "none"

  STATUS_HEARTBEAT_INTERVAL_SECS: "10"
  # Sengaja kecil: connect serentak di libIEC61850 bisa menghasilkan koneksi mati yang tetap
  # terbaca CONNECTED (docs/CATATAN_TERBUKA.md)
  MAX_CONCURRENT_CONNECTS: "4"
  # Tanpa tanda hidup selama ini (detik) -> cek LLN0.Mod.stVal; gagal -> reconnect
  LIVENESS_SECS: "30"

  PING_INTERVAL_MS: "5000"
  PING_TIMEOUT_MS: "2000"
  PING_ATTEMPTS: "3"
  PING_RETRY_DELAY_MS: "200"
  PING_RESEND_EVERY: "6"
  PING_CONCURRENCY: "500"

  RUST_LOG: "info"
  # Di Kubernetes log dibaca dari stdout (kubectl logs); file di dalam pod tidak dipakai
  LOG_TO_FILE: "false"
  RUST_BACKTRACE: "0"
